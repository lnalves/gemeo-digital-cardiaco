# Parâmetros do sistema. Qualquer alteração deve ser registrada em docs/DECISOES.md.
seed: 42

data:
  raw_dir: data/raw/mitdb
  processed_dir: data/processed
  physionet_db: mitdb
  download_workers: 8        # registros baixados em paralelo (PhysioNet limita a vazão por conexão)
  lead: MLII
  fs: 360
  paced_records: ["102", "104", "107", "217"]
  ds1: ["101", "106", "108", "109", "112", "114", "115", "116", "118", "119", "122",
        "124", "201", "203", "205", "207", "208", "209", "215", "220", "223", "230"]
  ds2: ["100", "103", "105", "111", "113", "117", "121", "123", "200", "202", "210",
        "212", "213", "214", "219", "221", "222", "228", "231", "232", "233", "234"]
  val_records: ["101", "124", "205", "207"]    # scripts/select_val_records.py com seed 42 (D-15)
  n_val_records: 4
  val_min_beats: {S: 100, V: 200, F: 10}         # DS1-val precisa de arritmias para o early stopping...
  val_max_fraction: {S: 0.35, V: 0.35, F: 0.35}  # ... sem tirar a maior parte de uma classe do treino
  aami_map:
    N: ["N", "L", "R", "e", "j"]
    S: ["A", "a", "J", "S"]
    V: ["V", "E"]
    F: ["F"]
    Q: ["/", "f", "Q"]
  classes: ["N", "S", "V", "F", "Q"]

signal:
  bandpass_hz: [0.5, 40.0]
  filter_order: 4            # Butterworth, forma SOS, aplicação causal (D-02)
  peak_match_tol_ms: 150     # ANSI/AAMI EC57

rpeaks:                      # Pan-Tompkins simplificado, causal (D-03, D-16)
  mwi_ms: 150                # janela de integração
  refractory_ms: 200
  learning_s: 2.0            # fase inicial que estima os limiares
  threshold_frac: 0.15       # limiar = NPK + frac·(SPK − NPK); ajustado em DS1 (D-16)
  peak_ema: 0.125            # peso do pico novo na média de SPK/NPK
  rr_avg_beats: 8
  searchback_rr_factor: 1.66 # sem QRS por 1,66·RR médio → busca de volta
  searchback_threshold_scale: 0.3
  searchback_peak_ema: 0.25
  twave_ms: 360              # candidato tão perto do QRS anterior pode ser onda T...
  twave_slope_frac: 0.5      # ... se a inclinação máxima for menor que esta fração da do QRS anterior

segment:
  pre_samples: 90            # 250 ms antes do R
  post_samples: 166          # ~461 ms depois do R → 256 amostras
  template_beats: 50         # batimento habitual = mediana dos 50 anteriores (D-20)
  r_refine_ms: 50           # R = extremo de |x| filtrado em ±50 ms, igual no treino e na execução (D-16)
  normalize: zscore

features:
  local_rr_beats: 10
  long_rr_beats: 300         # ritmo habitual do paciente (~5 min), média causal (D-19)
  qrs_search_ms: 100
  qrs_slope_frac: 0.1        # 0,2 dava QRS normal de 42–69 ms em DS1 (D-17)
  qrs_valid_range_ms: [40, 220]

model:
  context_beats: 5           # i-3 … i+1 (1 batimento futuro) — D-08
  future_beats: 1
  rr_features: ["rr_pre", "rr_post", "rr_local", "rr_pre_ratio", "rr_post_ratio",
                "rr_pre_long_ratio", "rr_post_long_ratio", "rr_local_long_ratio"]  # D-19
  beat_channels: ["beats"]   # + "beat_diff": batimento menos o habitual do paciente (D-20)
  augment_noise_std: 0.0     # ruído gaussiano por amostra (unidades do escore z), só no treino
  augment_baseline_std: 0.0  # deslocamento + rampa linear aleatórios por batimento, só no treino
  cnn_filters: [32, 64, 128]
  cnn_kernels: [7, 5, 3]
  lstm_units: 64
  attention_units: 64        # atenção aditiva (Bahdanau) sobre os K batimentos
  dense_units: 64
  dropout: 0.3
  lr: 0.001
  batch_size: 256
  max_epochs: 60
  patience: 8
  loss: focal                # weighted_ce | focal; empate no DS1-val (D-21)
  focal_gamma: 2.0
  class_weight_cap: 50.0     # focal usa os mesmos pesos como alfa: só γ difere da CE ponderada (D-18)

evaluation:
  macro_classes: ["N", "S", "V", "F"]   # macro sem Q (D-11); também é o critério do early stopping (D-15)
  wilcoxon_alpha: 0.05       # FP(B) < FP(A), pareado por registro, unilateral (A-03)
  latency_budget_ms: 500     # RNF01: bloco → eventos (D-01)

profile:
  calibration_seconds: 300
  features: ["rr_pre", "qrs_width_ms", "r_amplitude"]   # chaves de signal.features.beat_features
  n_bins: 20                 # + 2 bins de transbordo (D-05)
  range_percentiles: [1, 99]
  eps: 1.0e-6
  window_seconds: 30         # ajustado no DS1-val (D-26)
  step_seconds: 10
  k: 1.5                     # ajustado no DS1-val: run 20261014-173844_tune_profile (D-26)
  alpha: 0.1                 # taxa de atualização (Eq. 10)
  tuning_grid:
    k: [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
    window_seconds: [30, 60, 90]
  max_sensitivity_drop_pp: 15.0   # 5 p.p. só admitia k = 0 (−4 % de FP) no DS1-val (D-26, A-06)

decision:
  vt_consecutive_v: 3
  episode_gap_s: 10

engine:
  chunk_seconds: 1.0
  rpeak_source: detector     # detector | annotation (D-03)
  use_profile: true
  feedback_enabled: false    # SEMPRE false na avaliação quantitativa
  signal_buffer_seconds: 10  # sinal filtrado guardado para recortar batimentos detectados com atraso

server:
  host: 127.0.0.1
  port: 8000
  db_path: artifacts/cardiac_twin.sqlite
  model_run: artifacts/runs/20261014-154129_train_focal_s43_e1_long_rr  # modelo final (D-21)
  cors_origins: ["http://localhost:5173"]
  default_speed: 1.0         # 1× = tempo real; o dashboard oferece 1× e 5× (ARQUITETURA §10)
  monitor_queue_size: 2000   # mensagens por dashboard; fila cheia → cliente lento é desconectado (D-28)
  hr_beats: 10               # FC exibida = média dos últimos RR

paths:
  runs_dir: artifacts/runs
