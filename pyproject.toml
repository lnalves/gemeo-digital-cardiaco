[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cardiac-twin"
version = "0.1.0"
description = "Gêmeo digital cardíaco para detecção de arritmias em tempo real (TC UNISC)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Leonardo Nunes Alves" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "wfdb>=4.1",
    "scikit-learn>=1.4",
    "tensorflow>=2.16",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "pydantic>=2.6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.4", "ipykernel>=6.29", "neurokit2>=0.2"]
gpu-cuda = ["tensorflow[and-cuda]>=2.16; sys_platform == 'linux'"]

[tool.hatch.build.targets.wheel]
packages = ["src/cardiac_twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: testes que leem a MIT-BIH ou treinam modelo",
    "data: requer data/raw/mitdb baixado",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
